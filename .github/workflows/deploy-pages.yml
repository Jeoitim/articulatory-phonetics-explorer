# Deploy the static build to GitHub Pages.
#
# Requires repo setting: Settings -> Pages -> Source = "GitHub Actions".
#
# The build runs `next.config.ts` in static-export mode via PAGES_EXPORT=1
# (output: "export") with PAGES_BASE_PATH=/articulatory-phonetics-explorer.
# The publishable files land in dist/client/<PAGES_BASE_PATH>/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          PAGES_EXPORT: '1'
          PAGES_BASE_PATH: /articulatory-phonetics-explorer

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: cp dist/client/404.html dist/client/articulatory-phonetics-explorer/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # vinext export-mode writes files under dist/client/<basePath>/.
          # GitHub Pages project sites already serve at /<repo>/, so the
          # inner directory is the correct web root (avoids double prefix).
          path: dist/client/articulatory-phonetics-explorer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
