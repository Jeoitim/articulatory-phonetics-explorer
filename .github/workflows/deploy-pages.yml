# 将静态构建部署到 GitHub Pages。
#
# 仓库设置要求：Settings -> Pages -> Source = "GitHub Actions"。
#
# 构建通过 `build:static` 开启静态导出，并设置
# PAGES_BASE_PATH=/articulatory-phonetics-explorer。
# 可发布文件位于 dist/client/<PAGES_BASE_PATH>/。

name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 构建静态站点
        run: npm run build:static
        env:
          PAGES_BASE_PATH: /articulatory-phonetics-explorer

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 准备 Pages 产物
        run: cp dist/client/404.html dist/client/articulatory-phonetics-explorer/404.html

      - name: 检查静态产物
        run: npm run deployment:check
        env:
          PAGES_BASE_PATH: /articulatory-phonetics-explorer

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          # vinext 静态导出会将文件写入 dist/client/<basePath>/。
          # GitHub Pages 项目站点已经提供 /<repo>/ 这一层，
          # 因此内层目录才是正确的网站根目录，可以避免重复前缀。
          path: dist/client/articulatory-phonetics-explorer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
